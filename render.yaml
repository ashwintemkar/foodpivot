services:
  - type: web
    name: foodpivot
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: pnpm start
    envVars:
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_LLM_PROVIDER
        value: google
      - key: BACKBOARD_MODEL_NAME
        value: gemma-4-26b-a4b-it
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
